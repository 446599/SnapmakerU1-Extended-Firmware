# Mario Course Clear — higher pitch; temp disable StealthChop for louder/sharper tone

[gcode_macro _SONG_NOTE]
description: High-frequency stepper beep
gcode:
    {% set hz = params.HZ|float %}
    {% set beats = params.BEATS|default(1)|float %}
    {% set beat_ms = 140 %}
    {% set ms = beat_ms * beats %}
    {% set feed = (hz * 48)|int %}
    {% if feed < 22000 %}{% set feed = 22000 %}{% endif %}
    {% if feed > 30000 %}{% set feed = 30000 %}{% endif %}
    {% set half = 0.045 %}
    {% set cycles = (ms / 12)|int %}
    {% if cycles < 7 %}{% set cycles = 7 %}{% endif %}
    {% if cycles > 80 %}{% set cycles = 80 %}{% endif %}
    {% for i in range(cycles) %}
        G1 X{half} F{feed}
        G1 X-{half} F{feed}
    {% endfor %}
    G4 P{ (10 * beats)|int }

[gcode_macro PRINT_DONE_SONG]
description: Mario course-clear; briefly disable XY StealthChop
gcode:
    {% if "xy" not in printer.toolhead.homed_axes %}
        RESPOND TYPE=echo MSG="PRINT_DONE_SONG skipped: XY not homed"
    {% else %}
        {% set save_fm = printer.gcode_move.speed_factor %}
        M220 S100
        {% set maxv = printer.configfile.settings.printer.max_velocity|default(500)|float %}
        SET_VELOCITY_LIMIT VELOCITY={maxv}
        # SpreadCycle for louder/sharper tone
        SET_TMC_FIELD STEPPER=stepper_x FIELD=TPWMTHRS VALUE=0
        SET_TMC_FIELD STEPPER=stepper_y FIELD=TPWMTHRS VALUE=0
        G91
        # higher than last liked version
        _SONG_NOTE HZ=2093 BEATS=1
        _SONG_NOTE HZ=2637 BEATS=1
        _SONG_NOTE HZ=3136 BEATS=1
        _SONG_NOTE HZ=4186 BEATS=2
        _SONG_NOTE HZ=3136 BEATS=1
        _SONG_NOTE HZ=4186 BEATS=3
        _SONG_NOTE HZ=2093 BEATS=1
        _SONG_NOTE HZ=2637 BEATS=1
        _SONG_NOTE HZ=3136 BEATS=1
        _SONG_NOTE HZ=4186 BEATS=2
        _SONG_NOTE HZ=3136 BEATS=1
        _SONG_NOTE HZ=4186 BEATS=3
        _SONG_NOTE HZ=2093 BEATS=1
        _SONG_NOTE HZ=2637 BEATS=1
        _SONG_NOTE HZ=3136 BEATS=1
        _SONG_NOTE HZ=4186 BEATS=1
        _SONG_NOTE HZ=5274 BEATS=1
        _SONG_NOTE HZ=6272 BEATS=1
        _SONG_NOTE HZ=8372 BEATS=5
        G90
        M220 S{ (save_fm * 100)|round|int }
        # restore StealthChop threshold
        SET_TMC_FIELD STEPPER=stepper_x FIELD=TPWMTHRS VALUE=1048575
        SET_TMC_FIELD STEPPER=stepper_y FIELD=TPWMTHRS VALUE=1048575
        RESPOND TYPE=echo MSG="PRINT_DONE_SONG done"
    {% endif %}

[gcode_macro _PRINT_END_SONG]
description: Auto-invoked by PRINT_END
gcode:
    PRINT_DONE_SONG
